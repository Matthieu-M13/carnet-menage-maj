<html lang="fr">
<head>

  <style>
    :root{--cream:#F5F2EA;--dark:#2E332F;--sage:#5B7461;--red:#B4553F;--border:#E9E5DA;--muted:#8A8578;--white:#fff;--orange:#C9873D}
    *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--dark);font-family:-apple-system,'Helvetica Neue',Arial,sans-serif}
    button,input,textarea{font:inherit} button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:112px}
    header{background:var(--dark);color:white;padding:calc(22px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 24px 24px}
    .head{display:flex;align-items:center;justify-content:space-between;gap:14px}.brandBlock{display:flex;align-items:center;gap:13px;min-width:0}.brandMark{width:64px;height:64px;overflow:hidden;border-radius:16px;background:#fff;flex:none;box-shadow:0 3px 12px #0003}.brandMark img{width:100%;height:100%;object-fit:cover;transform:scale(1.72)}.brandText{min-width:0}.eyebrow{font-size:12px;letter-spacing:1.5px;color:#c9cec9}.title{font-size:25px;font-weight:750;margin:5px 0}.date{color:#d9ddd9;font-size:14px}.ring{position:relative;width:72px;height:72px;flex:none}.ring svg{transform:rotate(-90deg)}.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:15px}
    .tabs{display:flex;overflow:auto;gap:8px;padding:16px 14px 8px;scrollbar-width:none}.tab{border:1px solid var(--border);background:white;padding:10px 16px;border-radius:999px;white-space:nowrap;color:var(--muted)}.tab.active{background:var(--sage);color:white;border-color:var(--sage)}
    main{padding:8px 14px}.card{background:white;border:1px solid var(--border);border-radius:16px;margin-bottom:12px;overflow:hidden}.cardpad{padding:16px}.sectionHead{width:100%;border:0;background:white;padding:17px;display:flex;align-items:center;justify-content:space-between;text-align:left}.sectionTitle{font-weight:700}.counter{font-size:12px;color:var(--muted);margin-top:4px}.badge{background:#FFF1DE;color:#9A5C16;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700}.item{padding:14px 16px;border-top:1px solid var(--border)}.itemrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.itemlabel{font-size:15px;line-height:1.3;flex:1}.choices{display:flex;gap:8px}.choice{width:39px;height:39px;border-radius:50%;border:1px solid var(--border);background:#fafafa;font-weight:800}.choice.ok.on{background:var(--sage);color:white}.choice.bad.on{background:var(--red);color:white}.problemInput,.field{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px;background:#fcfbf7}.task{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}.task input{width:21px;height:21px;accent-color:var(--sage);flex:none}.task.done label{text-decoration:line-through;color:var(--muted)}
    .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo,.addPhoto{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:cover;image-orientation:from-image;cursor:zoom-in}.deletePhoto{position:absolute;z-index:2;right:5px;top:5px;border:0;background:#000b;color:white;border-radius:50%;width:30px;height:30px}.addPhoto{border:2px dashed #cfc9ba;background:#faf8f2;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px}.addPhoto b{font-size:26px;display:block}.photoModal{position:fixed;z-index:100;inset:0;background:#000e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}.photoModal img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;image-orientation:from-image;border-radius:10px}.photoTools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}.photoTools button{border:0;border-radius:11px;padding:11px 14px;background:white;color:var(--dark);font-weight:700}.photoTools .closePhoto{background:var(--red);color:white}.label{font-size:13px;font-weight:650;margin-top:15px;display:block}.field{margin-top:6px;resize:vertical}.helper{font-size:12px;color:var(--muted);line-height:1.45}.fixed{position:fixed;z-index:10;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--cream) 25%);padding:22px 14px calc(12px + env(safe-area-inset-bottom))}.primary{display:block;width:min(732px,100%);margin:auto;border:0;border-radius:14px;background:var(--dark);color:white;padding:16px;font-weight:750;font-size:16px}.primary:disabled{opacity:.55}.secondary,.danger,.small{border:1px solid var(--border);background:white;border-radius:11px;padding:10px 13px}.danger{color:var(--red)}.small{padding:7px 9px}.rolebar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0}.rolebar button{border:0;background:transparent;color:var(--sage);font-weight:650}.notice{padding:12px 14px;background:#fff8e9;border:1px solid #eed8aa;border-radius:12px;margin-bottom:12px;font-size:13px}.adminRow{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.adminRow input{margin:0;flex:1}.adminActions{display:flex;gap:6px}.adminSection{margin-bottom:20px}.adminSection h3{margin:0 0 8px}.adminAdd{display:flex;gap:8px;margin-top:10px}.adminAdd input{margin:0;flex:1}.login{max-width:420px;margin:36px auto}.topActions{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:13px;margin:10px 0;color:var(--sage)}
    @media(min-width:650px){header{margin-top:12px;border-radius:24px}.app{padding-left:10px;padding-right:10px}.photos{grid-template-columns:repeat(4,1fr)}}
  </style>
