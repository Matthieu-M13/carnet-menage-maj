 <main>
 {tab==='inventory'&&<Inventory sections={sections} report={report} update={updateInv}/>} 
 {tab==='tasks'&&<React.Fragment><div className="card">{tasks.map(t=><div className={'task '+(report.tasks[t.id]?'done':'')} key={t.id}><input id={t.id} type="checkbox" checked={!!report.tasks[t.id]} onChange={e=>setReport(r=>({...r,tasks:{...r.tasks,[t.id]:e.target.checked}}))}/><label htmlFor={t.id}>{t.label}</label></div>)}</div><button className="danger" onClick={reset}>Réinitialiser pour un nouveau ménage</button></React.Fragment>}
 {tab==='photos'&&<div className="card cardpad"><h2>Photos du logement</h2><p className="helper">Prenez une nouvelle photo ou choisissez-en dans la galerie. Touchez une photo pour l’agrandir, la tourner ou la télécharger. Maximum 12.</p><div className="photoSources"><label className="addPhoto camera"><span><b>📷</b>Prendre une photo</span><input hidden type="file" accept="image/*" capture="environment" onChange={async e=>{await photos(e.target.files);e.target.value='' } }/></label><label className="addPhoto"><span><b>🖼️</b>Choisir dans la galerie</span><input hidden type="file" accept="image/*" multiple onChange={async e=>{await photos(e.target.files);e.target.value='' } }/></label></div><div className="photos">{report.photos.map((p,i)=><div className="photo" key={i}><img src={p} alt={`Photo ${i+1}`} onClick={()=>setViewPhoto(i)}/><button className="deletePhoto" aria-label={`Supprimer la photo ${i+1}`} onClick={()=>{setReport(r=>({...r,photos:r.photos.filter((_,n)=>n!==i)}));if(viewPhoto===i)setViewPhoto(null)}}>×</button></div>)}</div></div>}
 {tab==='message'&&<div className="card cardpad"><h2>Informations du rapport</h2><label className="label">Lieu / Adresse du logement</label><input className="field" value={report.place} onChange={e=>setReport(r=>({...r,place:e.target.value}))}/><label className="label">Votre nom</label><input className="field" value={report.worker} onChange={e=>setReport(r=>({...r,worker:e.target.value}))}/><label className="label">Message complémentaire</label><textarea className="field" rows="6" value={report.message} onChange={e=>setReport(r=>({...r,message:e.target.value}))}/></div>}
 </main>{viewPhoto!==null&&report.photos[viewPhoto]&&<div className="photoModal" role="dialog" aria-modal="true" aria-label="Photo agrandie" onClick={()=>setViewPhoto(null)}><img src={report.photos[viewPhoto]} alt={`Photo ${viewPhoto+1} agrandie`} onClick={e=>e.stopPropagation()}/><div className="photoTools" onClick={e=>e.stopPropagation()}><button onClick={()=>rotatePhoto(viewPhoto)}>↻ Tourner 90°</button><button onClick={()=>downloadPhoto(report.photos[viewPhoto],viewPhoto)}>⬇ Télécharger</button><button className="closePhoto" onClick={()=>setViewPhoto(null)}>Fermer</button></div></div>}<div className="fixed"><button className="primary" disabled={busy} onClick={share}>{busy?'Préparation…':'📤 Partager le rapport'}</button></div></div>
}
function Inventory({sections,report,update}){const [open,setOpen]=useState(sections[0]?.id);return <React.Fragment>{sections.map(s=>{const n=s.items.filter(i=>report.inventory[i.id]?.status).length,b=s.items.filter(i=>report.inventory[i.id]?.status==='bad').length;return <div className="card" key={s.id}><button className="sectionHead" onClick={()=>setOpen(open===s.id?null:s.id)}><div><div className="sectionTitle">{s.name}</div><div className="counter">{n}/{s.items.length} vérifiés</div></div><div>{b>0&&<span className="badge">{b} problème{b>1?'s':''}</span>}　{open===s.id?'⌃':'⌄'}</div></button>{open===s.id&&s.items.map(i=>{const v=report.inventory[i.id]||{};return <div className="item" key={i.id}><div className="itemrow"><div className="itemlabel">{i.label}</div><div className="choices"><button className={'choice ok '+(v.status==='ok'?'on':'')} onClick={()=>update(i.id,{status:'ok'})}>✓</button><button className={'choice bad '+(v.status==='bad'?'on':'')} onClick={()=>update(i.id,{status:'bad'})}>✕</button></div></div>{v.status==='bad'&&<input className="problemInput" placeholder="Précisez : cassé, manquant, sale…" value={v.comment||''} onChange={e=>update(i.id,{comment:e.target.value})}/>}</div>})}</div>})}</React.Fragment>}
function Admin({db,configured,session,sections,tasks,reload,close}){const [email,setEmail]=useState(''),[password,setPassword]=useState(''),[msg,setMsg]=useState(''),[newTask,setNewTask]=useState('');
 async function login(e){e.preventDefault();setMsg('Connexion…');const {error}=await db.auth.signInWithPassword({email,password});setMsg(error?error.message:'Connecté.')}
 async function save(table,id,patch){const {error}=await db.from(table).update(patch).eq('id',id);if(error)alert(error.message);else reload()}
 async function addTask(){if(!newTask.trim())return;const {error}=await db.from('housekeeping_tasks').insert({label:newTask.trim(),position:tasks.length+1});if(error)alert(error.message);else{setNewTask('');reload()}}
 async function addItem(section){const label=prompt('Nom du nouvel élément :');if(!label)return;const {error}=await db.from('housekeeping_inventory_items').insert({section_id:section.id,label,position:section.items.length+1});if(error)alert(error.message);else reload()}
 if(!configured)return <div className="app"><main><div className="card cardpad login"><h2>Configuration nécessaire</h2><div className="notice">L’accès MAJ sera activé après avoir renseigné l’URL et la clé publique Supabase dans le fichier index.html.</div><button className="secondary" onClick={close}>← Retour</button></div></main></div>;
 if(!session)return <div className="app"><main><form className="card cardpad login" onSubmit={login}><h2>Accès MAJ</h2><p className="helper">Connexion réservée à l’administrateur.</p><label className="label">E-mail</label><input className="field" type="email" required value={email} onChange={e=>setEmail(e.target.value)}/><label className="label">Mot de passe</label><input className="field" type="password" required value={password} onChange={e=>setPassword(e.target.value)}/><p className="status">{msg}</p><button className="primary">Se connecter</button><br/><button type="button" className="secondary" onClick={close}>← Retour</button></form></main></div>;
 return <div className="app"><header><div className="eyebrow">ACCÈS ADMINISTRATEUR</div><div className="title">Gestion du carnet MAJ</div></header><main><div className="topActions"><button className="secondary" onClick={close}>← Voir le carnet</button><button className="danger" onClick={()=>db.auth.signOut()}>Déconnexion</button></div><div className="card cardpad" style={{marginTop:12}}><div className="adminSection"><h3>Tâches de ménage</h3>{tasks.map(t=><EditRow key={t.id} value={t.label} save={v=>save('housekeeping_tasks',t.id,{label:v})} remove={()=>save('housekeeping_tasks',t.id,{active:false})}/>) }<div className="adminAdd"><input className="field" placeholder="Nouvelle tâche" value={newTask} onChange={e=>setNewTask(e.target.value)}/><button className="secondary" onClick={addTask}>Ajouter</button></div></div>{sections.map(s=><div className="adminSection" key={s.id}><h3>{s.name}</h3>{s.items.map(i=><EditRow key={i.id} value={i.label} save={v=>save('housekeeping_inventory_items',i.id,{label:v})} remove={()=>save('housekeeping_inventory_items',i.id,{active:false})}/>)}<button className="secondary" onClick={()=>addItem(s)}>＋ Ajouter un élément</button></div>)}</div></main></div>}
function EditRow({value,save,remove}){const [v,setV]=useState(value);useEffect(()=>setV(value),[value]);return <div className="adminRow"><input className="field" value={v} onChange={e=>setV(e.target.value)}/><div className="adminActions"><button className="small" onClick={()=>save(v)}>✓</button><button className="small danger" onClick={()=>confirm('Supprimer cet élément ?')&&remove()}>×</button></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
